[project]
name = "nerve-verify"
version = "0.1.0"
description = "Independent verification toolkit for NerveSystem Asset Action Receipts (AAR)."
license = "MIT"
authors = [{ name = "NerveSystem" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42.0",
    "click>=8.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
nerve-verify = "nerve_verify.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nerve_verify*"]
